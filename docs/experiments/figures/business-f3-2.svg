<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 692" role="img" aria-labelledby="title desc">
  <title id="title">금융 3 · 내부 검토 · 질문부터 출력까지</title>
  <desc id="desc">금융 3 · 내부 검토 / 현재 자료로 기업 관계의 / 내부 검토를 완료할 수 있나? / e1: 기업 A / 법인 상태 ACTIVE / e1: LEI 등록 상태 LAPSED / r1: 유효한 직접 회계 연결 관계 / 대상 기업·스냅샷 상태 확인 / 내부 정책: ACTIVE + ISSUED / LAPSED에서 조기 반환 / review_ready · 검토 가능 / review_required · 재검토 필요 / 근거: e1 / 법인 소멸 아님</desc>
  <g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
