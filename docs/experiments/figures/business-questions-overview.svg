    <g transform="translate(764,816)">
      <rect width="360" height="692" rx="18" fill="#ffffff" stroke="#cdd8e4"/>
      <text x="20" y="31" font-size="19" fill="#153957" font-weight="700">금융 3 · 내부 검토</text>
      <text x="20" y="55" font-size="12" fill="#52657b" font-weight="400">합성 입력 · 저장된 실행 F3-2</text>
      <rect x="16" y="70" width="328" height="90" rx="12" fill="#eaf1fb"/>
      <text x="28" y="94" font-size="12" fill="#365c86" font-weight="700">업무 질문</text>
      <text x="28" y="120" font-size="17" fill="#182b42" font-weight="700">현재 자료로 기업 관계의</text>
