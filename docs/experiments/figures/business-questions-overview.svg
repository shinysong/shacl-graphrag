      <text x="28" y="223" font-size="14" fill="#182b42" font-weight="400">e1: 기업 A / 법인 상태 ACTIVE</text>
      <text x="28" y="247" font-size="14" fill="#182b42" font-weight="400">e1: LEI 등록 상태 LAPSED</text>
      <text x="28" y="271" font-size="14" fill="#182b42" font-weight="400">r1: 유효한 직접 회계 연결 관계</text>
      <text x="173" y="310" font-size="22" fill="#446987" font-weight="400">↓</text>
      <rect x="16" y="320" width="328" height="116" rx="12" fill="#e9f4f3"/>
      <text x="28" y="344" font-size="12" fill="#21625d" font-weight="700">규칙 조건의 탐색·판단</text>
      <text x="28" y="370" font-size="14" fill="#182b42" font-weight="400">대상 기업·스냅샷 상태 확인</text>
      <text x="28" y="394" font-size="14" fill="#182b42" font-weight="400">내부 정책: ACTIVE + ISSUED</text>
