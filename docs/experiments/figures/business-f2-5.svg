    <text x="28" y="394" font-size="14" fill="#182b42" font-weight="400">r1 유효 / r2는 기간 만료로 제외</text>
    <text x="28" y="418" font-size="14" fill="#182b42" font-weight="400">B의 유효 근거가 없어 비교 보류</text>
    <text x="173" y="457" font-size="22" fill="#446987" font-weight="400">↓</text>
    <rect x="16" y="466" width="328" height="88" rx="12" fill="#fff1e6"/>
    <text x="28" y="490" font-size="12" fill="#92501f" font-weight="700">단순 조회의 실제 출력</text>
    <text x="28" y="516" font-size="14" fill="#182b42" font-weight="400">known · true</text>
    <text x="28" y="540" font-size="14" fill="#182b42" font-weight="400">같은 모회사로 판단</text>
