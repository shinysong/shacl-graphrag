<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 692" role="img" aria-labelledby="title desc">
  <title id="title">금융 2 · 최종 모회사 · 질문부터 출력까지</title>
  <desc id="desc">금융 2 · 최종 모회사 / A와 B의 보고된 최종 / 회계 연결 모회사는 같은가? / r1: A → P / 최종 모회사 / r2: B → P / 종료 2026-10-11 / 질의 기준일: 2026-10-12 / 각 기업의 최종 모회사 관계 선택 / r1 유효 / r2는 기간 만료로 제외 / B의 유효 근거가 없어 비교 보류 / known · true / 같은 모회사로 판단 / unknown · 확인 불가 / 출력 근거: [] / 다르다는 뜻 아님</desc>
  <g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <rect width="360" height="692" rx="18" fill="#ffffff" stroke="#cdd8e4"/>
