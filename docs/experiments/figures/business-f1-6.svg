<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 692" role="img" aria-labelledby="title desc">
  <title id="title">금융 1 · 직접 모회사 · 질문부터 출력까지</title>
  <desc id="desc">금융 1 · 직접 모회사 / 기업 A의 직접 회계 연결 / 모회사는 어디인가? / r1: A → P / FUND_MANAGER / ACTIVE·PUBLISHED / 기간 유효 / 직접 회계 연결·보고 예외 없음 / A의 직접 회계 연결 관계 선택 / 운용 관계 r1은 역할이 달라 제외 / 해당 범주의 보고 예외도 없음 / known · LEI-P / 운용사를 모회사처럼 반환 / unknown · 확인 불가 / 출력 근거: [] / 모회사 없음 아님</desc>
  <g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <rect width="360" height="692" rx="18" fill="#ffffff" stroke="#cdd8e4"/>
    <text x="20" y="31" font-size="19" fill="#153957" font-weight="700">금융 1 · 직접 모회사</text>
    <text x="20" y="55" font-size="12" fill="#52657b" font-weight="400">합성 입력 · 저장된 실행 F1-6</text>
    <rect x="16" y="70" width="328" height="90" rx="12" fill="#eaf1fb"/>
    <text x="28" y="94" font-size="12" fill="#365c86" font-weight="700">업무 질문</text>
    <text x="28" y="120" font-size="17" fill="#182b42" font-weight="700">기업 A의 직접 회계 연결</text>
    <text x="28" y="144" font-size="17" fill="#182b42" font-weight="700">모회사는 어디인가?</text>
    <rect x="16" y="174" width="328" height="115" rx="12" fill="#f2f5f9"/>
    <text x="28" y="197" font-size="12" fill="#52657b" font-weight="700">입력 데이터</text>
    <text x="28" y="223" font-size="14" fill="#182b42" font-weight="400">r1: A → P / FUND_MANAGER</text>
    <text x="28" y="247" font-size="14" fill="#182b42" font-weight="400">ACTIVE·PUBLISHED / 기간 유효</text>
    <text x="28" y="271" font-size="14" fill="#182b42" font-weight="400">직접 회계 연결·보고 예외 없음</text>
    <text x="173" y="310" font-size="22" fill="#446987" font-weight="400">↓</text>
    <rect x="16" y="320" width="328" height="116" rx="12" fill="#e9f4f3"/>
    <text x="28" y="344" font-size="12" fill="#21625d" font-weight="700">규칙 조건의 탐색·판단</text>
    <text x="28" y="370" font-size="14" fill="#182b42" font-weight="400">A의 직접 회계 연결 관계 선택</text>
    <text x="28" y="394" font-size="14" fill="#182b42" font-weight="400">운용 관계 r1은 역할이 달라 제외</text>
    <text x="28" y="418" font-size="14" fill="#182b42" font-weight="400">해당 범주의 보고 예외도 없음</text>
    <text x="173" y="457" font-size="22" fill="#446987" font-weight="400">↓</text>
    <rect x="16" y="466" width="328" height="88" rx="12" fill="#fff1e6"/>
    <text x="28" y="490" font-size="12" fill="#92501f" font-weight="700">단순 조회의 실제 출력</text>
    <text x="28" y="516" font-size="14" fill="#182b42" font-weight="400">known · LEI-P</text>
    <text x="28" y="540" font-size="14" fill="#182b42" font-weight="400">운용사를 모회사처럼 반환</text>
    <rect x="16" y="565" width="328" height="91" rx="12" fill="#eaf1fb"/>
    <text x="28" y="589" font-size="12" fill="#365c86" font-weight="700">규칙·JSON = 같은 규칙·RDF</text>
    <text x="28" y="615" font-size="14" fill="#182b42" font-weight="400">unknown · 확인 불가</text>
    <text x="28" y="639" font-size="14" fill="#182b42" font-weight="400">출력 근거: [] / 모회사 없음 아님</text>
    <text x="20" y="679" font-size="11" fill="#52657b" font-weight="400">과정은 코드·입력에서 재구성 / 출력은 실행 기록</text>
