<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" role="img" aria-labelledby="title desc">
  <title id="title">실제 GLEIF 관계가 있어도 보류되는 과정</title>
  <desc id="desc">GESTION PLACEMENTS DESJARDINS INC.의 ACTIVE 직접 모회사 관계가 LAPSED 등록 상태로 인해 내부 PUBLISHED 전용 정책에서 제외된다. 단순 조회는 보고된 모회사를 반환하고 JSON/RDF 규칙은 unknown을 반환한다.</desc>
  <g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <rect width="360" height="760" rx="18" fill="#fff" stroke="#cdd8e4"/>
    <text x="20" y="32" font-size="18" fill="#182b42" font-weight="700">실제 GLEIF · 조회와 채택 기준</text>
    <text x="20" y="56" font-size="12" fill="#52657b" font-weight="400">Golden Copy 2026-10-12 / 정답률 미부여</text>
    <rect x="16" y="72" width="328" height="100" rx="12" fill="#eaf1fb"/>
    <text x="28" y="98" font-size="12" fill="#365c86" font-weight="700">업무 질문</text>
    <text x="28" y="125" font-size="16" fill="#182b42" font-weight="700">GESTION PLACEMENTS의</text>
    <text x="28" y="149" font-size="16" fill="#182b42" font-weight="700">보고된 직접 모회사는 어디인가?</text>
    <rect x="16" y="188" width="328" height="145" rx="12" fill="#f2f5f9"/>
    <text x="28" y="213" font-size="12" fill="#52657b" font-weight="700">실제 RR 10행 · 원천에 관계 존재</text>
    <text x="28" y="240" font-size="13" fill="#182b42" font-weight="400">주체: 010PWNH4K3BLIC3I7R03</text>
    <text x="28" y="264" font-size="13" fill="#182b42" font-weight="400">모회사: 549300COKYB5EGSU1838</text>
    <text x="28" y="288" font-size="13" fill="#182b42" font-weight="400">관계: 직접 회계 연결</text>
    <text x="28" y="312" font-size="13" fill="#182b42" font-weight="400">관계 ACTIVE / 등록 LAPSED</text>
    <text x="173" y="358" font-size="22" fill="#182b42" font-weight="400">↓</text>
    <rect x="16" y="370" width="328" height="140" rx="12" fill="#e9f4f3"/>
    <text x="28" y="396" font-size="12" fill="#21625d" font-weight="700">조회와 내부 정책 적용</text>
    <text x="28" y="423" font-size="13" fill="#182b42" font-weight="400">선택 주체의 RR·REPEX 전체 검색</text>
    <text x="28" y="447" font-size="13" fill="#182b42" font-weight="400">관계 기간은 유효 / 종료일 없음</text>
    <text x="28" y="471" font-size="13" fill="#182b42" font-weight="400">내부 규칙: PUBLISHED만 채택</text>
    <text x="28" y="495" font-size="13" fill="#182b42" font-weight="400">LAPSED → 판단에 사용할 자료에서 제외</text>
    <text x="173" y="534" font-size="22" fill="#182b42" font-weight="400">↓</text>
    <rect x="16" y="545" width="328" height="72" rx="12" fill="#fff1e6"/>
    <text x="28" y="569" font-size="12" fill="#92501f" font-weight="700">단순 조회의 실제 출력</text>
    <text x="28" y="595" font-size="13" fill="#182b42" font-weight="400">known · 549300COKYB5EGSU1838</text>
    <rect x="16" y="630" width="328" height="94" rx="12" fill="#eaf1fb"/>
    <text x="28" y="655" font-size="12" fill="#365c86" font-weight="700">규칙·JSON = 같은 규칙·RDF</text>
    <text x="28" y="681" font-size="14" fill="#182b42" font-weight="400">unknown · 확인 불가 / 근거 []</text>
    <text x="28" y="705" font-size="14" fill="#182b42" font-weight="400">관계 부재가 아닌 채택 정책의 결과</text>
    <text x="20" y="746" font-size="12" fill="#52657b" font-weight="400">LAPSED는 관계가 거짓이라는 증명이 아님</text>
