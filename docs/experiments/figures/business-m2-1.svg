<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 692" role="img" aria-labelledby="title desc">
  <title id="title">제조 2 · 교체 조건 · 질문부터 출력까지</title>
  <desc id="desc">제조 2 · 교체 조건 / 대체 부품이 규격·인증 / 조건을 충족하나? / c1: 50 µm / cert-A / interface-A / 요구: ≤ 0.1 mm / cert-A / 인터페이스 일치 / 유효 레코드 / 후보 레코드 선택·유효성 확인 / 50 µm → 0.05 mm로 환산 / 허용치·인증·인터페이스 비교 / blocked · 조건 미충족 / eligible · 선언한 조건 충족 / 근거: c1 / 실제 교체 승인 아님</desc>
  <g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <rect width="360" height="692" rx="18" fill="#ffffff" stroke="#cdd8e4"/>
    <text x="20" y="31" font-size="19" fill="#153957" font-weight="700">제조 2 · 교체 조건</text>
    <text x="20" y="55" font-size="12" fill="#52657b" font-weight="400">합성 입력 · 저장된 실행 M2-1</text>
    <rect x="16" y="70" width="328" height="90" rx="12" fill="#eaf1fb"/>
    <text x="28" y="94" font-size="12" fill="#365c86" font-weight="700">업무 질문</text>
    <text x="28" y="120" font-size="17" fill="#182b42" font-weight="700">대체 부품이 규격·인증</text>
    <text x="28" y="144" font-size="17" fill="#182b42" font-weight="700">조건을 충족하나?</text>
    <rect x="16" y="174" width="328" height="115" rx="12" fill="#f2f5f9"/>
    <text x="28" y="197" font-size="12" fill="#52657b" font-weight="700">입력 데이터</text>
    <text x="28" y="223" font-size="14" fill="#182b42" font-weight="400">c1: 50 µm / cert-A / interface-A</text>
    <text x="28" y="247" font-size="14" fill="#182b42" font-weight="400">요구: ≤ 0.1 mm / cert-A</text>
    <text x="28" y="271" font-size="14" fill="#182b42" font-weight="400">인터페이스 일치 / 유효 레코드</text>
    <text x="173" y="310" font-size="22" fill="#446987" font-weight="400">↓</text>
    <rect x="16" y="320" width="328" height="116" rx="12" fill="#e9f4f3"/>
    <text x="28" y="344" font-size="12" fill="#21625d" font-weight="700">규칙 조건의 탐색·판단</text>
    <text x="28" y="370" font-size="14" fill="#182b42" font-weight="400">후보 레코드 선택·유효성 확인</text>
    <text x="28" y="394" font-size="14" fill="#182b42" font-weight="400">50 µm → 0.05 mm로 환산</text>
    <text x="28" y="418" font-size="14" fill="#182b42" font-weight="400">허용치·인증·인터페이스 비교</text>
    <text x="173" y="457" font-size="22" fill="#446987" font-weight="400">↓</text>
    <rect x="16" y="466" width="328" height="88" rx="12" fill="#fff1e6"/>
    <text x="28" y="490" font-size="12" fill="#92501f" font-weight="700">단순 조회의 실제 출력</text>
    <text x="28" y="516" font-size="14" fill="#182b42" font-weight="400">blocked · 조건 미충족</text>
    <rect x="16" y="565" width="328" height="91" rx="12" fill="#eaf1fb"/>
    <text x="28" y="589" font-size="12" fill="#365c86" font-weight="700">규칙·JSON = 같은 규칙·RDF</text>
    <text x="28" y="615" font-size="14" fill="#182b42" font-weight="400">eligible · 선언한 조건 충족</text>
    <text x="28" y="639" font-size="14" fill="#182b42" font-weight="400">근거: c1 / 실제 교체 승인 아님</text>
    <text x="20" y="679" font-size="11" fill="#52657b" font-weight="400">과정은 코드·입력에서 재구성 / 출력은 실행 기록</text>
  </g>
</svg>
