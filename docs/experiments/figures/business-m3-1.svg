  <desc id="desc">제조 3 · 재검사 항목 / 공차만 변경했을 때 / 어떤 검사를 다시 하나? / h1: spec.tolerance 변경 / d1: 공차 → fit-review / d2·d3: 인증·조립 검사 의존성 / 완전한 의존성 목록 선언 확인 / 변경 필드와 의존성 필드 연결 / required=true인 항목만 선택 / known · 조립·인증·공차 / 검사 세 항목을 모두 반환 / known · fit-review만 / 근거: d1, h1</desc>
