<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">관계와 검증 보고서의 RAG 답변 기여 연구</title><desc id="desc">공통 원자료에서 B 개선 검색, C 관계 확장, D 동일 근거와 SHACL 보고서를 비교한다. 최종 LLM 답변 비교는 미실행이다.</desc><defs><style>@font-face{font-family:P;src:url(Pretendard-Regular.woff2)}text{font-family:P,Arial,sans-serif;fill:#182b42} .muted{fill:#586b80}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#677d93" stroke-width="1.5"/></marker></defs><rect width="1600" height="900" fill="#f5f7fb"/><text x="50" y="48" font-size="18" font-weight="600" style="fill:#58718d">RESEARCH ARCHITECTURE  /  2026.11.03</text><text x="50" y="105" font-size="43" font-weight="700">관계와 검증 보고서는 RAG 답변에 언제 도움이 되는가</text><text x="50" y="151" font-size="26" font-weight="400" style="fill:#52667c">목표  근거 없는 단정과 불필요한 보류를 함께 줄이고, 사람이 검토할 근거를 남긴다.</text><rect x="50" y="210" width="285" height="355" rx="18" fill="#fff" stroke="#dbe3ed"/><text x="75" y="252" font-size="29" font-weight="700">공통 입력</text><text x="75" y="301" font-size="24" font-weight="400">실제 원자료</text><text x="75" y="340" font-size="24" font-weight="400">자연어 질문</text><text x="75" y="379" font-size="24" font-weight="400">출처·원문 위치 보존</text><rect x="70" y="425" width="245" height="115" rx="10" fill="#edf2f8" stroke="#dbe3ed"/><text x="87" y="458" font-size="24" font-weight="600">A1  벡터 검색</text><text x="87" y="492" font-size="21" font-weight="400">dense 검색 기준선</text><text x="87" y="521" font-size="20" font-weight="400" style="fill:#586b80">검색 비교에 포함</text><path d="M335 285 H390" fill="none" stroke="#677d93" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="400" y="210" width="545" height="100" rx="18" fill="#edf3ff" stroke="#dbe3ed"/><text x="423" y="269" font-size="35" font-weight="700">B</text><text x="479" y="250" font-size="28" font-weight="700">개선 검색</text><text x="479" y="286" font-size="23" font-weight="400">BM25 + dense + rerank</text><path d="M945 260 H1030" fill="none" stroke="#677d93" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="400" y="345" width="545" height="100" rx="18" fill="#e8f5f2" stroke="#dbe3ed"/><text x="423" y="404" font-size="35" font-weight="700">C</text><text x="479" y="385" font-size="28" font-weight="700">관계 확장</text><text x="479" y="421" font-size="23" font-weight="400">B + 관계 탐색으로 연결된 근거 추가</text><path d="M945 395 H1030" fill="none" stroke="#677d93" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="400" y="480" width="545" height="100" rx="18" fill="#fff3e3" stroke="#dbe3ed"/><text x="423" y="539" font-size="35" font-weight="700">D</text><text x="479" y="520" font-size="28" font-weight="700">검증 보고서</text><text x="479" y="556" font-size="23" font-weight="400">C와 정확히 같은 근거 + SHACL 보고서</text><path d="M945 530 H1030" fill="none" stroke="#677d93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M430 310 V335" fill="none" stroke="#677d93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M430 445 V470" fill="none" stroke="#677d93" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1045" y="210" width="505" height="370" rx="18" fill="#fff" stroke="#dbe3ed"/><text x="1072" y="253" font-size="29" font-weight="700">동일 LLM 조건</text><text x="1072" y="290" font-size="24" font-weight="400">같은 모델 · 공통 총 입력 한도</text><text x="1072" y="326" font-size="24" font-weight="400">같은 출력 여유분</text><path d="M1295 345 V375" fill="none" stroke="#677d93" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1070" y="390" width="455" height="130" rx="12" fill="#eef2f8" stroke="#dbe3ed"/><text x="1093" y="430" font-size="28" font-weight="700">최종 답변</text><text x="1093" y="466" font-size="23" font-weight="400">답변 + 출처 인용 + 한계</text><text x="1093" y="501" font-size="23" font-weight="400">필요하면 구체적 검토 요청</text><text x="1072" y="553" font-size="23" font-weight="600" style="fill:#395675">B↔C 관계 효과  /  C↔D 보고서 효과</text><text x="405" y="613" font-size="22" font-weight="400" style="fill:#7b592c">SHACL은 참고 정보: 조건 적합성 ≠ 사실의 진실성·자료의 완전성</text><rect x="50" y="647" width="1500" height="83" rx="14" fill="#192f49" stroke="#192f49"/><text x="75" y="681" font-size="25" font-weight="700" style="fill:#fff">평가</text><text x="165" y="681" font-size="25" font-weight="400" style="fill:#fff">원자료와의 일치 · 인용 근거 · 근거 없는 단정 · 불필요한 보류 · 검토 요청</text><text x="165" y="712" font-size="20" font-weight="400" style="fill:#cad7e7">기존 개발 문항을 재사용한 탐색 연구 · 최종 답변 비교는 B/C/D 24문항 × 3조건</text><text x="55" y="770" font-size="22" font-weight="700" style="fill:#167064">완료</text><text x="125" y="770" font-size="23" font-weight="400">검색·관계·SHACL/Python 오프라인 점검, 입력 72건 준비</text><text x="850" y="770" font-size="22" font-weight="700" style="fill:#a36515">미측정</text><text x="940" y="770" font-size="23" font-weight="400">최종 LLM 답변 · 보고서의 개선 효과</text><text x="55" y="817" font-size="21" font-weight="600" style="fill:#536b85">별도 비교 축</text><text x="200" y="817" font-size="22" font-weight="400">같은 정책의 SQL/Python · 로컬 Neo4j 점검 / Neptune 실제 실행은 준비 단계</text><text x="55" y="859" font-size="21" font-weight="600" style="fill:#536b85">후속 과제</text><text x="200" y="859" font-size="22" font-weight="400">전문가와 AI가 관계·스키마·검사 조건 고도화 / 자연어 자동 생성은 미검증</text></svg>