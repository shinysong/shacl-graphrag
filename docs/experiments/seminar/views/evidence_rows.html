<div class="columns"><section class="panel"><h3>원천에도 관계가 없는 경우</h3><table><thead><tr><th>원천 BOM</th><th>parent</th><th>child</th></tr></thead><tbody><tr><td>b1</td><td>A1</td><td>P1</td></tr><tr><td>—</td><td>PRODUCT_X</td><td>미기록</td></tr></tbody></table><table><thead><tr><th>검색 반환</th><th>parent</th><th>child</th></tr></thead><tbody><tr><td>b1</td><td>A1</td><td>P1</td></tr></tbody></table><p>새 검색만으로 빠진 관계를 만들 수 없다.<br><b>출력: 완제품 범위 확인 불가</b></p></section><section class="panel"><h3>원천에는 있지만 검색에서 누락</h3><table><thead><tr><th>원천 BOM</th><th>parent</th><th>child</th></tr></thead><tbody><tr><td>b1</td><td>A1</td><td>P1</td></tr><tr><td>b2</td><td>PRODUCT_X</td><td>A1</td></tr></tbody></table><table><thead><tr><th>검색 반환</th><th>parent</th><th>child</th></tr></thead><tbody><tr><td>b1</td><td>A1</td><td>P1</td></tr></tbody></table><p>반환 범위를 보완하면 b2를 찾을 수 있다.<br><b>출력: 보완 후 PRODUCT_X 후보</b></p></section></div><p class="small">작성한 설명용 데이터. 원천 스냅샷을 따로 보존해야 두 실패를 구분할 수 있다.</p>
