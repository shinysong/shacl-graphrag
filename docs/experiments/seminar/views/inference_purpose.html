<div class="columns"><section class="panel"><h3>기록과 정의</h3><p><b>입력 기록</b><br>P1은 볼트다.<br>P1은 조립품 A1에 장착된다.</p><hr><p><b>함께 제공한 정의</b><br>볼트 ⊆ 체결 부품 ⊆ 구성 부품<br>장착된다 ↔ 포함한다 (역관계)</p></section><section class="panel"><h3>추론 후 추가로 조회할 수 있는 결론</h3><p class="metric">P1은 구성 부품이다.</p><p class="metric">A1은 P1을 포함한다.</p><p>직접 적지 않은 타입과 역방향 관계를<br>입력과 정의를 결합해 계산한다.</p></section></div>
