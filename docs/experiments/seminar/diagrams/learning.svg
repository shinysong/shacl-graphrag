<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 200" role="img" aria-labelledby="learning-title learning-desc" font-family="Pretendard, sans-serif"><title id="learning-title">의미 공유에서 도입 판단까지 25장 구성</title><desc id="learning-desc">업무 의미와 규칙 공유에서 시작해 RDF·OWL·SHACL 실습을 거쳐 도구 계약·검토 기록·도입 기준으로 이어진다.</desc><defs><marker id="learning-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#879bb6" stroke-width="1.4"/></marker></defs><g class="step story-step" data-step="0"><rect class="story-box" x="6.0" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="24.0" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="12" r="7"/><path d="M10 43v-7c0-10 28-10 28 0v7M18 43v-9M30 43v-9"/></svg><text x="74.0" y="51" font-size="21" fill="#14212f" font-weight="700">01–05 · 업무 의미와 규칙</text><text x="26.0" y="89" font-size="18" fill="#465970">대체 가능의 네 층위 구분</text><text x="26.0" y="114" font-size="18" fill="#465970">공통 규칙 공유와 적재·통합 점검</text></g><path d="M360.3333333333333 95H378.3333333333333" fill="none" stroke="#879bb6" stroke-width="2" marker-end="url(#learning-arrow)"/><g class="step story-step" data-step="1"><rect class="story-box" x="385.3333333333333" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="403.3333333333333" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="10" r="5"/><circle cx="36" cy="24" r="5"/><circle cx="12" cy="38" r="5"/><path d="m16 13 16 9m0 5-16 9M12 15v18"/></svg><text x="453.3333333333333" y="51" font-size="21" fill="#14212f" font-weight="700">06–21 · 추론과 SHACL 실습</text><text x="405.3333333333333" y="89" font-size="18" fill="#46597