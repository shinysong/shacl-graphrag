<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 200" role="img" aria-labelledby="reasoning-title reasoning-desc" font-family="Pretendard, sans-serif"><title id="reasoning-title">관계 근거와 정책 판단의 분리</title><desc id="reasoning-desc">직원에서 소속 팀을 찾고, 팀과 부서와 본부의 관계를 따라 공통 본부를 확인한다. 본부가 같을 때 차단한다는 조건은 별도 업무 규칙이다.</desc><defs><marker id="reasoning-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#879bb6" stroke-width="1.4"/></marker></defs><g class="step story-step" data-step="0"><rect class="story-box" x="6.0" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="24.0" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="12" r="7"/><path d="M10 43v-7c0-10 28-10 28 0v7M18 43v-9M30 43v-9"/></svg><text x="74.0" y="51" font-size="21" fill="#14212f" font-weight="700">검토자</text><text x="26.0" y="89" font-size="18" fill="#465970">assignedTo → TeamA</text><text x="26.0" y="114" font-size="18" fill="#465970">소속 팀을 찾는 조회</text></g><path d="M360.3333333333333 95H378.3333333333333" fill="none" stroke="#879bb6" stroke-width="2" marker-end="url(#reasoning-arrow)"/><g class="step story-step" data-step="1"><rect class="story-box" x="385.3333333333333" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="403.3333333333333" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="10" r="5"/><circle cx="36" cy="24" r="5"/><circle cx="12" cy="38" r="5"/><path d="m16 13 16 9m0 5-16 9M12 15v18"/></svg><text x="453.3333333333333" y="51" font-size="21" fill="#14212f" font-weight="700">조직 관계</text><text x="405.3333333333333" y="89" font-size="18" fill="#465970">TeamA → DeptA → Sales</text><text x="405.3333333333333" y="114" font-size="18" fill="#465970">partOf의 전이성을 선언</text></g><path d="M739.6666666666666 95H757.6666666666666" fill="none" stroke="#879bb6" stroke-width="2" marker-end="url(#reasoning-arrow)"/><g class="step story-step" data-step="2"><rect class="story-box" x="764.6666666666666" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="782.6666666666666" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="10" y="5" width="28" height="38" rx="3"/><path d="m15 16 3 3 5-6M26 16h6m-17 11 3 3 5-6M26 27h6"/></svg><text x="832.6666666666666" y="51" font-size="21" fill="#14212f" font-weight="700">업무 검사</text><text x="784.6666666666666" y="89" font-size="18" fill="#465970">요청 부서도 Sales인가?</text><text x="784.6666666666666" y="114" font-size="18" fill="#465970">같은 본부 차단 규칙 적용</text></g></svg>