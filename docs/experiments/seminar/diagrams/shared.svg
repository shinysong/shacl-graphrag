<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 200" role="img" aria-labelledby="shared-title shared-desc" font-family="Pretendard, sans-serif"><title id="shared-title">데이터 적재부터 질의 전달까지 네 곳의 품질 관리 지점</title><desc id="shared-desc">새 데이터 적재, 데이터 통합, 자격·정책 변경, 질의 결과 전달 단계에서 각각 필수 조건을 검사하되 원천 결함과 조회 누락을 구분한다.</desc><defs><marker id="shared-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#879bb6" stroke-width="1.4"/></marker></defs><g class="step story-step" data-step="0"><rect class="story-box" x="6" y="12" width="256" height="172" rx="9" fill="#fff" stroke="#c5d2e4"/><text x="24" y="48" font-size="20" fill="#245dc0" font-weight="700">1. 새 데이터 적재</text><text x="24" y="84" font-size="17" fill="#14212f" font-weight="600">필수 식별자·타입·참조</text><text x="24" y="116" font-size="16" fill="#465970">누락·자료형 오류를</text><text x="24" y="142" font-size="16" fill="#465970">적재 직후 확인</text></g><path d="M266 98H286" stroke="#879bb6" fill="none" stroke-width="2" marker-end="url(#shared-arrow)"/><g class="step story-step" data-step="1"><rect class="story-box" x="290" y="12" width="256" height="172" rx="9" fill="#fff" stroke="#c5d2e4"/><text x="308" y="48" font-size="20" fill="#245dc0" font-weight="700">2. 데이터 통합</text><text x="308" y="84" font-size="17" fill="#14212f" font-weight="600">출처 간 관계 의미 대조</text><text x="308" y="116" font-size="16" fill="#465970">같은 관계명을 다른 뜻으로</text><text x="308" y="142" font-size="16" fill="#465970">쓰지 않는지 점검</text></g><path d="M550 98H570" stroke="#879bb6" fill="none" stroke-width="2" marker-end="url(#shared-arrow)"/><g class="step story-step" data-step="2"><rect class="story-box" x="574" y="12" width="256" height="172" rx="9" fill="#fff" stroke="#c5d2e4"/><text x="592" y="48" font-size="20" fill="#245dc0" font-weight="700">3. 자격·정책 변경</text><text x="592" y="84" font-size="17" fill="#14212f" font-weight="600">기존 기록의 재검토 범위</text><text x="592" y="116" font-size="16" fill="#465970">바뀐 조건을 만족하지 못하는</text><text x="592" y="142" font-size="16" fill="#465970">후보만 표적 추출</text></g><path d="M834 98H854" stroke="#879bb6" fill="none" stroke-width="2" marker-end="url(#shared-arrow)"/><g class="step story-step" data-step="3"><rect class="story-box" x="858" y="12" width="256" height="172" rx="9" fill="#fff" stroke="#c5d2e4"/><text x="876" y="48" font-size="20" fill="#245dc0" font-weight="700">4. 질의 결과 전달</text><text x="876" y="84" font-size="17" fill="#14212f" font-weight="600">판단 근거의 입력 완전성</text><text x="876" y="116" font-size="16" fill="#465970">원천 결함과 조회 누락을</text><text x="876" y="142" font-size="16" fill="#465970">구분해 LLM에 전달</text></g></svg>