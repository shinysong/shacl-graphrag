<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 265" role="img" aria-labelledby="shared-title shared-desc" font-family="Pretendard, sans-serif"><title id="shared-title">하나의 의미·검사 계약을 여러 시스템에서 사용</title><desc id="shared-desc">목표 구조. 기존 데이터 원본과 업무 실행 시스템은 유지하면서 공통 계약을 연결한다. 자동 배포 기능이나 측정된 운영 효과를 뜻하지 않는다.</desc><defs><marker id="shared-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#879bb6" stroke-width="1.4"/></marker></defs><g class="step story-step" data-step="0"><rect class="story-box" x="230" y="5" width="660" height="108" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="248" y="20" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="10" r="5"/><circle cx="36" cy="24" r="5"/><circle cx="12" cy="38" r="5"/><path d="m16 13 16 9m0 5-16 9M12 15v18"/></svg><text x="298" y="46" font-size="21" fill="#14212f" font-weight="700">공유 의미·검사 계약</text><text x="250" y="84" font-size="18" fill="#465970">식별자 · 관계 · OWL 공리 · SHACL Shape · 버전</text></g><path d="M560 113V130H180V147" stroke="#879bb6" fill="none" stroke-width="1.8" marker-end="url(#shared-arrow)"/><g class="step story-step" data-step="1"><rect class="story-box" x="6" y="152" width="348" height="103" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="24" y="167" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="38" height="27" rx="3"/><path d="M24 34v8M14 42h20M12 15h24M12 22h15"/></svg><text x="74" y="193" font-size="21" fill="#14212f" font-weight="700">발주 서비스</text><text x="26" y="231" font-size="18" fill="#465970">필요한 데이터 투영</text></g><path d="M560 113V130H560V147" stroke="#879bb6" fill="none" stroke-width="1.8" marker-end="url(#shared-arrow)"/><g class="step story-step" data-step="2"><rect class="story-box" x="386" y="152" width="348" height="103" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="404" y="167" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="38" height="27" rx="3"/><path d="M24 34v8M14 42h20M12 15h24M12 22h15"/></svg><text x="454" y="193" font-size="21" fill="#14212f" font-weight="700">승인 워크플로</text><text x="406" y="231" font-size="18" fill="#465970">조회·판정·예외 처리</text></g><path d="M560 113V130H940V147" stroke="#879bb6" fill="none" stroke-width="1.8" marker-end="url(#shared-arrow)"/><g class="step story-step" data-step="3"><rect class="story-box" x="766" y="152" width="348" height="103" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="784" y="167" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="38" height="27" rx="3"/><path d="M24 34v8M14 42h20M12 15h24M12 22h15"/></svg><text x="834" y="193" font-size="21" fill="#14212f" font-weight="700">감사 서비스</text><text x="786" y="231" font-size="18" fill="#465970">근거·적용 버전 확인</text></g></svg>