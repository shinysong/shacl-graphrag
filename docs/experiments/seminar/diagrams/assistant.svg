<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 200" role="img" aria-labelledby="assistant-title assistant-desc" font-family="Pretendard, sans-serif"><title id="assistant-title">검증과 설명의 역할 분담</title><desc id="assistant-desc">목표 구조. 검증 결과를 LLM의 설명 입력으로 전달하고 사람이 근거와 예외를 검토한다. 실제 LLM 응답을 측정한 그림이 아니다.</desc><defs><marker id="assistant-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#879bb6" stroke-width="1.4"/></marker></defs><g class="step story-step" data-step="0"><rect class="story-box" x="6.0" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="24.0" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="19"/><path d="m14 24 7 7 14-16"/></svg><text x="74.0" y="51" font-size="21" fill="#14212f" font-weight="700">검증기</text><text x="26.0" y="89" font-size="18" fill="#465970">판정 · 위반 규칙</text><text x="26.0" y="114" font-size="18" fill="#465970">개체 · 경로 · 값</text></g><path d="M360.3333333333333 95H378.3333333333333" fill="none" stroke="#879bb6" stroke-width="2" marker-end="url(#assistant-arrow)"/><g class="step story-step" data-step="1"><rect class="story-box" x="385.3333333333333" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="403.3333333333333" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="38" height="27" rx="3"/><path d="M24 34v8M14 42h20M12 15h24M12 22h15"/></svg><text x="453.3333333333333" y="51" font-size="21" fill="#14212f" font-weight="700">LLM 설명</text><text x="405.3333333333333" y="89" font-size="18" fill="#465970">질문에 맞춰 근거를 인용</text><text x="405.3333333333333" y="114" font-size="18" fill="#465970">설명 정확도는 별도 검증</text></g><path d="M739.6666666666666 95H757.6666666666666" fill="none" stroke="#879bb6" stroke-width="2" marker-end="url(#assistant-arrow)"/><g class="step story-step" data-step="2"><rect class="story-box" x="764.6666666666666" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="782.6666666666666" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="12" r="7"/><path d="M10 43v-7c0-10 28-10 28 0v7M18 43v-9M30 43v-9"/></svg><text x="832.6666666666666" y="51" font-size="21" fill="#14212f" font-weight="700">업무 담당자</text><text x="784.6666666666666" y="89" font-size="18" fill="#465970">근거·보류·예외 확인</text><text x="784.6666666666666" y="114" font-size="18" fill="#465970">조직의 승인 절차 적용</text></g></svg>