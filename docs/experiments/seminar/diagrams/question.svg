<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 200" role="img" aria-labelledby="question-title question-desc" font-family="Pretendard, sans-serif"><title id="question-title">구매·승인·감사 담당자의 질문</title><desc id="question-desc">구매 담당자는 진행 여부를 묻고 승인 담당자는 조건을 확인하며 감사 담당자는 근거와 버전을 확인한다.</desc><defs><marker id="question-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#879bb6" stroke-width="1.4"/></marker></defs><g class="step story-step" data-step="0"><rect class="story-box" x="6.0" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="24.0" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="12" r="7"/><path d="M10 43v-7c0-10 28-10 28 0v7M18 43v-9M30 43v-9"/></svg><text x="74.0" y="51" font-size="21" fill="#14212f" font-weight="700">구매 담당자</text><text x="26.0" y="89" font-size="18" fill="#465970">검토자 소속이 바뀌었는데</text><text x="26.0" y="114" font-size="18" fill="#465970">이 발주를 진행해도 될까?</text></g><path d="M360.3333333333333 95H378.3333333333333" fill="none" stroke="#879bb6" stroke-width="2" marker-end="url(#question-arrow)"/><g class="step story-step" data-step="1"><rect class="story-box" x="385.3333333333333" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="403.3333333333333" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="12" r="7"/><path d="M10 43v-7c0-10 28-10 28 0v7M18 43v-9M30 43v-9"/></svg><text x="453.3333333333333" y="51" font-size="21" fill="#14212f" font-weight="700">승인 담당자</text><text x="405.3333333333333" y="89" font-size="18" fill="#465970">자격과 소속 관계에</text><text x="405.3333333333333" y="114" font-size="18" fill="#465970">바뀐 규정도 적용됐을까?</text></g><path d="M739.6666666666666 95H757.6666666666666" fill="none" stroke="#879bb6" stroke-width="2" marker-end="url(#question-arrow)"/><g class="step story-step" data-step="2"><rect class="story-box" x="764.6666666666666" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="782.6666666666666" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="12" r="7"/><path d="M10 43v-7c0-10 28-10 28 0v7M18 43v-9M30 43v-9"/></svg><text x="832.6666666666666" y="51" font-size="21" fill="#14212f" font-weight="700">감사 담당자</text><text x="784.6666666666666" y="89" font-size="18" fill="#465970">어떤 기록과 규정 버전으로</text><text x="784.6666666666666" y="114" font-size="18" fill="#465970">그렇게 판단했을까?</text></g></svg>