<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 200" role="img" aria-labelledby="lifecycle-title lifecycle-desc" font-family="Pretendard, sans-serif"><title id="lifecycle-title">공유 규칙의 변경 관리</title><desc id="lifecycle-desc">정의와 변경, 버전과 테스트, 배포와 재검토가 반복된다. 표준 형식만으로 운영 절차가 자동화되지는 않는다.</desc><defs><marker id="lifecycle-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#879bb6" stroke-width="1.4"/></marker></defs><g class="step story-step" data-step="0"><rect class="story-box" x="6.0" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="24.0" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="12" r="7"/><path d="M10 43v-7c0-10 28-10 28 0v7M18 43v-9M30 43v-9"/></svg><text x="74.0" y="51" font-size="21" fill="#14212f" font-weight="700">정의 · 변경</text><text x="26.0" y="89" font-size="18" fill="#465970">정책 담당자가 의미와</text><text x="26.0" y="114" font-size="18" fill="#465970">적용 범위를 확인</text></g><path d="M360.3333333333333 95H378.3333333333333" fill="none" stroke="#879bb6" stroke-width="2" marker-end="url(#lifecycle-arrow)"/><g class="step story-step" data-step="1"><rect class="story-box" x="385.3333333333333" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="403.3333333333333" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="10" y="5" width="28" height="38" rx="3"/><path d="m15 16 3 3 5-6M26 16h6m-17 11 3 3 5-6M26 27h6"/></svg><text x="453.3333333333333" y="51" font-size="21" fill="#14212f" font-weight="700">버전 · 회귀 검사</text><text x="405.3333333333333" y="89" font-size="18" fill="#465970">매핑과 Shape를 변경하고</text><text x="405.3333333333333" y="114" font-size="18" fill="#465970">반례·기존 사례를 점검</text></g><path d="M739.6666666666666 95H757.6666666666666" fill="none" stroke="#879bb6" stroke-width="2" marker-end="url(#lifecycle-arrow)"/><g class="step story-step" data-step="2"><rect class="story-box" x="764.6666666666666" y="10" width="349.3333333333333" height="170" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="782.6666666666666" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="38" height="27" rx="3"/><path d="M24 34v8M14 42h20M12 15h24M12 22h15"/></svg><text x="832.6666666666666" y="51" font-size="21" fill="#14212f" font-weight="700">배포 · 재검토</text><text x="784.6666666666666" y="89" font-size="18" fill="#465970">적용 버전과 소비처 확인</text><text x="784.6666666666666" y="114" font-size="18" fill="#465970">영향받는 요청 재검토</text></g></svg>