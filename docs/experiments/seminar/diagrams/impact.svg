<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="impact-title impact-desc" font-family="Pretendard, sans-serif"><title id="impact-title">인증 만료의 잠재 영향 범위</title><desc id="impact-desc">설계 예시. 인증서에서 부품, 조립품, 완제품을 연결하고 부품 유형과 적용 규정을 함께 확인한다. 물리적 손상이나 승인 여부를 자동 확정하지 않는다.</desc><defs><marker id="impact-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#879bb6" stroke-width="1.4"/></marker></defs><g class="step story-step" data-step="0"><rect class="story-box" x="6" y="10" width="268" height="115" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="24" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="10" y="5" width="28" height="38" rx="3"/><path d="m15 16 3 3 5-6M26 16h6m-17 11 3 3 5-6M26 27h6"/></svg><text x="74" y="51" font-size="21" fill="#14212f" font-weight="700">인증서</text><text x="26" y="89" font-size="18" fill="#465970">만료 상태 확인</text></g><path d="M274 68h12" stroke="#879bb6" marker-end="url(#impact-arrow)"/><g class="step story-step" data-step="1"><rect class="story-box" x="286" y="10" width="268" height="115" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="304" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="24" cy="10" rx="16" ry="6"/><path d="M8 10v27c0 8 32 8 32 0V10M8 23c0 8 32 8 32 0"/></svg><text x="354" y="51" font-size="21" fill="#14212f" font-weight="700">부품</text><text x="306" y="89" font-size="18" fill="#465970">인증 대상</text></g><path d="M554 68h12" stroke="#879bb6" marker-end="url(#impact-arrow)"/><g class="step story-step" data-step="2"><rect class="story-box" x="566" y="10" width="268" height="115" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="584" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="10" r="5"/><circle cx="36" cy="24" r="5"/><circle cx="12" cy="38" r="5"/><path d="m16 13 16 9m0 5-16 9M12 15v18"/></svg><text x="634" y="51" font-size="21" fill="#14212f" font-weight="700">조립품</text><text x="586" y="89" font-size="18" fill="#465970">부품 사용</text></g><path d="M834 68h12" stroke="#879bb6" marker-end="url(#impact-arrow)"/><g class="step story-step" data-step="3"><rect class="story-box" x="846" y="10" width="268" height="115" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="864" y="25" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="24" cy="10" rx="16" ry="6"/><path d="M8 10v27c0 8 32 8 32 0V10M8 23c0 8 32 8 32 0"/></svg><text x="914" y="51" font-size="21" fill="#14212f" font-weight="700">완제품</text><text x="866" y="89" font-size="18" fill="#465970">조립품 구성</text></g><path d="M420 125v50M700 175V125" stroke="#879bb6" fill="none"/><g class="step story-step" data-step="4"><rect class="story-box" x="286" y="175" width="268" height="115" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="304" y="190" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="10" r="5"/><circle cx="36" cy="24" r="5"/><circle cx="12" cy="38" r="5"/><path d="m16 13 16 9m0 5-16 9M12 15v18"/></svg><text x="354" y="216" font-size="21" fill="#14212f" font-weight="700">부품 유형</text><text x="306" y="254" font-size="18" fill="#465970">하위·상위 분류</text></g><g class="step story-step" data-step="5"><rect class="story-box" x="566" y="175" width="268" height="115" rx="9" fill="#fff" stroke="#c5d2e4"/><svg x="584" y="190" width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#245dc0" stroke-width="2.2" stroke-linecap="r