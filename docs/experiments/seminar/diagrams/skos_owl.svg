<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img" aria-labelledby="skos_owl-title skos_owl-desc" font-family="Pretendard, Noto Sans KR, sans-serif"><title id="skos_owl-title">개념 분류와 클래스 분류의 서로 다른 연결</title><desc id="skos_owl-desc">SKOS 개념 BoltConcept에서 FastenerConcept로 broader가 연결된다. OWL 클래스 Bolt에서 Fastener로 subClassOf가 연결되고 개체 P1은 Bolt 타입이다.</desc><defs><marker id="skos_owl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#245dc0" stroke-width="1.5"/></marker></defs><rect width="1120" height="390" rx="12" fill="white"/>
<text x="26" y="32" text-anchor="start" font-size="22" font-weight="700" fill="#142d49">개념 분류와 클래스 분류의 서로 다른 연결</text>
<rect x="20" y="60" width="520" height="265" rx="9" fill="#f4f8fd" stroke="#c7d5e5" stroke-width="1.5"/>
<rect x="570" y="60" width="530" height="265" rx="9" fill="#f4f8fd" stroke="#c7d5e5" stroke-width="1.5"/>
<text x="280" y="96" text-anchor="middle" font-size="22" font-weight="600" fill="#142d49">SKOS · 용어와 개념의 조직</text>
