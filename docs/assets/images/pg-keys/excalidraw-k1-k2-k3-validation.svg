<text x="467" y="89" font-size="14" fill="#212529" text-anchor="middle" class="exc-text" font-weight="700">(K1) EXCLUSIVE 반례 탐색 질의</text>
<text x="467" y="112" font-size="11.5" fill="#343a40" text-anchor="middle" class="exc-code" font-weight="700">p(x1) &amp; p(x2) &amp; q(x1,y) &amp; q(x2,y) &amp; x1 &lt;&gt; x2</text>
<text x="467" y="134" font-size="11.5" fill="#495057" text-anchor="middle" class="exc-text">서로 다른 두 대상(x1 != x2)이 같은 키 값(y)을 공유하는지 검사</text>
