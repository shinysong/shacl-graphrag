<text x="467" y="217" font-size="11.5" fill="#343a40" text-anchor="middle" class="exc-code" font-weight="700">p(x) WHERE NOT EXISTS q(x, y)</text>
<text x="467" y="239" font-size="11.5" fill="#495057" text-anchor="middle" class="exc-text">키 값(y)이 하나도 존재하지 않는 누락 대상(x)이 있는지 검사</text>
