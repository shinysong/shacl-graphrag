<text x="136" y="185" font-size="15" fill="#212529" text-anchor="middle" class="exc-text" font-weight="700">PG-Key 제약 선언</text>
<text x="136" y="212" font-size="13" fill="#343a40" text-anchor="middle" class="exc-code" font-weight="700">FOR p(x)</text>
<text x="136" y="232" font-size="13" fill="#343a40" text-anchor="middle" class="exc-code" font-weight="700">IDENTIFIER q(x, y)</text>
<text x="136" y="255" font-size="9.8" fill="#495057" text-anchor="middle" class="exc-text">(EXCLUSIVE + MANDATORY + SINGLETON)</text>
