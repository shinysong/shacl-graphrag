[project]
name = "shacl-graphrag"
version = "0.1.0"
description = "Ontology-constraint validation loop for GraphRAG (SHACL/OWL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "rdflib>=7.0.0",
  "pyshacl>=0.26.0",
  "pandas>=2.2.0",
  "tqdm>=4.66.0",
  "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6.0",
]
docs = [
    "mkdocs>=1.6,<2",
]
workbench = [
    "jsonschema>=4.26.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.21.1",
    "sqlalchemy>=2.1.5",
    "streamlit>=1.66.0",
]

[tool.uv]
package = false
