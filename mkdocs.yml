site_name: SHACL GraphRAG Lab
site_description: SHACL 검증 루프의 실험 명세와 실행 기록, 연구 일지
site_url: https://shinysong.github.io/shacl-graphrag/
repo_url: https://github.com/shinysong/shacl-graphrag
edit_uri: edit/cursor/add-readme-gitignore/docs/
exclude_docs: |
  /README.md
theme:
  name: mkdocs
  locale: ko
  color_mode: light
  user_color_mode_toggle: true
  nav_style: dark
nav:
  - Lab: index.md
  - 연구계획서: experiments/research-plan.md
  - 실험 명세: experiments/specification.md
  - 의미 판단 후속 실험: experiments/semantic-study.md
  - 복잡도와 최소 온톨로지 개입: experiments/hybrid-study.md
  - 개념 통합과 명시적 추론: experiments/ontology-study.md
  - 데이터 변경과 그래프 DB: experiments/graph-lifecycle-study.md
  - 공통 의미 규칙과 업무 변경: experiments/shared-semantics-study.md
  - 업무·버전·의미의 선택적 검사: experiments/semantic-guards-study.md
  - 선택적 검사 뒤의 추가조회: experiments/bounded-refresh-study.md
  - 도메인·데이터 구조 연구 지도: experiments/domain-characteristics.md
  - 부품 변경 영향 탐색: experiments/change-impact-study.md
  - 금융·제조업 업무 질문: experiments/business-questions-study.md
  - 실행 기록: experiments/records/index.md
  - 연구 일지: journal/index.md
  - 운영:
      - 기록과 공개: setup/recording.md
      - 호스트 구성: setup/bootstrap.md
      - 개발 도구: setup/agents.md
      - 연구 운영 에이전트: setup/research-operations.md
      - 로드맵: setup/roadmap.md
      - 시행착오: lessons-learned/README.md
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
extra_css:
  - stylesheets/lab.css
