site_name: SHACL GraphRAG Lab
site_description: SHACL 검증 루프의 실험 명세와 실행 기록, 연구 일지
site_url: https://shinysong.github.io/shacl-graphrag/
repo_url: https://github.com/shinysong/shacl-graphrag
edit_uri: edit/cursor/add-readme-gitignore/docs/
exclude_docs: |
  /README.md
theme:
  name: mkdocs
  locale: ko
  color_mode: light
  user_color_mode_toggle: true
  nav_style: dark
nav:
  - Lab: index.md
  - 실험 명세: experiments/specification.md
  - 실행 기록: experiments/records/index.md
  - 연구 일지: journal/index.md
  - 운영:
      - 기록과 공개: setup/recording.md
      - 호스트 구성: setup/bootstrap.md
      - 개발 도구: setup/agents.md
      - 로드맵: setup/roadmap.md
      - 시행착오: lessons-learned/README.md
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
extra_css:
  - stylesheets/lab.css
