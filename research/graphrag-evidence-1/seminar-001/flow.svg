<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" role="img" aria-labelledby="title desc"><title id="title">저장된 근거의 처리 흐름</title><desc id="desc">같은 원천에서 A와 B 검색을 비교하고 B의 선택 근거를 C와 E로 확장합니다. D는 C 근거를 그대로 두고 보고서를 추가합니다.</desc><rect width="940" height="260" fill="white"/><g font-family="Pretendard, sans-serif" font-size="17" fill="#17232e" stroke="#596b7a" stroke-width="1.5"><rect x="15" y="90" width="140" height="60" rx="6" fill="#f5f7f9"/><rect x="205" y="30" width="170" height="60" rx="6" fill="#f5f7f9"/><rect x="205" y="160" width="170" height="60" rx="6" fill="#f5f7f9"/><rect x="430" y="120" width="200" height="60" rx="6" fill="#f5f7f9"/><rect x="430" y="190" width="200" height="55" rx="6" fill="#f5f7f9"/><rect x="700" y="120" width="220" height="60" rx="6" fill="#f5f7f9"/><path d="M155 110 L180 110 L180 60 L205 60 M155 130 L180 130 L180 190 L205 190 M375 190 L400 190 L400 150 L430 150 M400 190 L400 217 L430 217 M630 150 L700 150" fill="none"/><g stroke="none" text-anchor="middle"><text x="85" y="126">같은 원천 기록</text><text x="290" y="66">A 벡터 검색</text><text x="290" y="196">B 혼합 검색</text><text x="530" y="156">C 관계 확장</text><text x="530" y="223">E 같은 규칙의 SQL</text><text x="810" y="156">D C 근거 + 보고서</text></g></g></svg>